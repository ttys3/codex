name: downstream-release

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream rust-v tag; empty selects the latest stable tag"
        required: false
        type: string
      revision:
        description: "Downstream release revision for this upstream tag"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: downstream-release
  cancel-in-progress: false

env:
  DOWNSTREAM_BRANCH: downstream/statusline
  UPSTREAM_REPOSITORY: openai/codex

jobs:
  prepare:
    name: Prepare candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      candidate_branch: ${{ steps.candidate.outputs.candidate_branch }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      release_tag: ${{ steps.candidate.outputs.release_tag }}
      skip: ${{ steps.candidate.outputs.skip }}
      upstream_tag: ${{ steps.candidate.outputs.upstream_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.DOWNSTREAM_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve upstream tag and push candidate branch
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REVISION: ${{ github.event.inputs.revision || '1' }}
          REQUESTED_TAG: ${{ github.event.inputs.upstream_tag || '' }}
        run: |
          set -euo pipefail

          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git" 2>/dev/null \
            || git remote set-url upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --force upstream "+refs/tags/rust-v*:refs/tags/rust-v*"

          upstream_tag="$REQUESTED_TAG"
          if [[ -z "$upstream_tag" ]]; then
            upstream_tag="$(
              git tag --list 'rust-v*' \
                | grep -E '^rust-v[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -V \
                | tail -n 1 \
                || true
            )"
          fi
          if [[ ! "$upstream_tag" =~ ^rust-v[0-9]+\.[0-9]+\.[0-9]+(-(alpha(\.[0-9]+){0,2}|beta(\.[0-9]+)?))?$ ]]; then
            echo "Invalid upstream tag: ${upstream_tag:-<empty>}" >&2
            exit 1
          fi
          if ! git rev-parse --verify --quiet "${upstream_tag}^{commit}" >/dev/null; then
            echo "Upstream tag does not exist: $upstream_tag" >&2
            exit 1
          fi

          revision="$REQUESTED_REVISION"
          if [[ ! "$revision" =~ ^[1-9][0-9]*$ ]]; then
            echo "Revision must be a positive integer: $revision" >&2
            exit 1
          fi
          release_tag="statusline-v${upstream_tag#rust-v}-r${revision}"

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            {
              echo "candidate_branch="
              echo "candidate_sha="
              echo "release_tag=$release_tag"
              echo "skip=true"
              echo "upstream_tag=$upstream_tag"
            } >> "$GITHUB_OUTPUT"
            echo "Release $release_tag already exists; nothing to do."
            exit 0
          fi

          marker_file=".downstream/upstream-tag"
          if [[ ! -f "$marker_file" ]]; then
            echo "Missing $marker_file" >&2
            exit 1
          fi
          current_tag="$(tr -d '\r\n' < "$marker_file")"
          if [[ ! "$current_tag" =~ ^rust-v[0-9]+\.[0-9]+\.[0-9]+(-(alpha(\.[0-9]+){0,2}|beta(\.[0-9]+)?))?$ ]]; then
            echo "Invalid current upstream marker: $current_tag" >&2
            exit 1
          fi
          current_commit="$(git rev-parse "${current_tag}^{commit}")"
          target_commit="$(git rev-parse "${upstream_tag}^{commit}")"

          # Upstream tags every release on a commit that does nothing but bump the
          # workspace version, and never merges that commit back into main. No two
          # rust-v tags therefore share an ancestry line, so forward progress is a
          # version comparison and not a history walk. sort -V orders X.Y.Z before
          # X.Y.Z-alpha.N; Debian's `~` restores semver's prerelease order.
          semver_key() { printf '%s' "${1#rust-v}" | tr '-' '~'; }
          current_key="$(semver_key "$current_tag")"
          target_key="$(semver_key "$upstream_tag")"
          oldest_key="$(printf '%s\n%s\n' "$current_key" "$target_key" | sort -V | head -n 1)"
          if [[ "$current_key" != "$target_key" && "$oldest_key" != "$current_key" ]]; then
            echo "$upstream_tag is not a forward update from $current_tag" >&2
            exit 1
          fi

          if [[ "$current_commit" != "$target_commit" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ! git merge --no-ff --no-commit "$target_commit"; then
              # Both release commits rewrite the workspace version, so that line
              # collides on every upstream bump. Upstream owns the field; take its
              # value as long as the fork has kept its hands off the file.
              unmerged="$(git diff --name-only --diff-filter=U)"
              if [[ "$unmerged" != "codex-rs/Cargo.toml" ]] \
                || ! git diff --quiet "$current_tag" HEAD -- codex-rs/Cargo.toml; then
                echo "Merging $upstream_tag into $DOWNSTREAM_BRANCH left conflicts in:" >&2
                awk '{ print "  " $0 }' <<< "$unmerged" >&2
                exit 1
              fi
              git checkout --theirs -- codex-rs/Cargo.toml
              git add -- codex-rs/Cargo.toml
            fi
            printf '%s\n' "$upstream_tag" > "$marker_file"
            git add "$marker_file"
            git commit \
              -m "chore(upstream): merge $upstream_tag" \
              -m "Co-Authored-By: Codex (gpt-5.6-sol) <noreply@openai.com>"
          fi

          candidate_branch="automation/${release_tag}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          candidate_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$candidate_branch"

          {
            echo "candidate_branch=$candidate_branch"
            echo "candidate_sha=$candidate_sha"
            echo "release_tag=$release_tag"
            echo "skip=false"
            echo "upstream_tag=$upstream_tag"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Verify downstream patch
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt

      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: nextest@0.9.103

      # setup-ci points CARGO_TARGET_DIR at $HOME/.cache/codex-ci/cargo-target,
      # outside the workspace, so rust-cache cannot apply its target pruning
      # here. Cache only the registry: a full test-profile target directory
      # would be several GB and crowd the 10 GB repository cache limit that the
      # three build jobs below depend on.
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: codex-rs
          cache-targets: false
          cache-bin: false

      - name: Install Linux test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bubblewrap \
            libcap-dev \
            pkg-config \
            shellcheck

      - name: Check Rust formatting
        run: cargo fmt -- --config imports_granularity=Item --check

      - name: Check generated config schema
        shell: bash
        run: |
          set -euo pipefail
          just write-config-schema
          git -C "$GITHUB_WORKSPACE" diff --exit-code -- codex-rs/core/config.schema.json

      - name: Test status-line extensions
        run: just test -p codex-tui status_line_extensions

      - name: Test status-line command configuration
        run: just test -p codex-config -p codex-core status_line_command

      - name: Test downstream update action
        run: just test -p codex-tui update_action

      - name: Test daemon updater selection
        run: just test -p codex-app-server-daemon update_loop

      - name: Test downstream update script
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/install/downstream-update.sh
          shellcheck -s sh scripts/install/downstream-update.sh
          python3 scripts/install/test_downstream_update_sh.py

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      SCCACHE_IDLE_TIMEOUT: "0"
      TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            is_linux: true
            timeout_minutes: 90
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            is_linux: true
            timeout_minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Install sccache
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          # install-action takes the version through the tool input; a separate
          # `version` key is not a valid input and is silently ignored, which
          # left every build resolving whatever the manifest called latest.
          tool: sccache@0.17.0

      # The Actions cache endpoints are only injected into JavaScript actions,
      # so re-export them for the sccache server spawned by the run steps below.
      - name: Export Actions cache endpoints
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'on');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Enable sccache
        shell: bash
        run: |
          set -euo pipefail
          wrapper="$(command -v sccache)"
          echo "RUSTC_WRAPPER=$wrapper" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_RUSTC_WRAPPER=$wrapper" >> "$GITHUB_ENV"
          # Fall back to the local disk cache instead of failing the whole build
          # when the Actions cache endpoints are unavailable.
          if [[ -n "${ACTIONS_RESULTS_URL:-}" && -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
            echo "Actions cache unavailable; using the sccache local disk cache"
          fi

      - name: Use hermetic Cargo home
        if: matrix.is_linux
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"

      # Must run after the hermetic Cargo home is exported: rust-cache reads
      # CARGO_HOME from the environment, so restoring earlier would populate the
      # runner's default ~/.cargo instead. `key` separates the matrix legs,
      # which otherwise share the `build` job id.
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: codex-rs
          key: ${{ matrix.target }}
          cache-bin: false

      - name: Install Zig
        if: matrix.is_linux
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      - name: Install musl build tools
        if: matrix.is_linux
        env:
          APT_INSTALL_ARGS: --no-install-recommends
          APT_UPDATE_ARGS: -o Acquire::Retries=3
          DEBIAN_FRONTEND: noninteractive
        shell: bash
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - name: Disable aws-lc jitter entropy
        if: matrix.is_linux
        shell: bash
        run: |
          set -euo pipefail
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${TARGET}"
          target_no_jitter="${target_no_jitter//-/_}"
          echo "${target_no_jitter}=1" >> "$GITHUB_ENV"

      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      # rust-cache prunes a profile directory down to build/, .fingerprint/ and
      # deps/, so the librusty_v8.a that the v8 build script unpacks into
      # gn_out/obj never reaches the cache while the fingerprint claiming it was
      # already unpacked does. A restored build then links against an empty
      # gn_out and fails with "could not find native static library `rusty_v8`".
      # Unpacking the archive back into place keeps that fingerprint valid, so
      # neither v8 nor the ~125 crates behind it are rebuilt; clearing the
      # fingerprint instead would force all of them through the compiler again.
      # This mirrors the build script's own copy_archive(), which gunzips the
      # archive when it starts with the gzip magic bytes.
      - name: Restore the rusty_v8 static library dropped by the cache
        shell: bash
        run: |
          set -euo pipefail
          lib_dir="target/${TARGET}/release/gn_out/obj"
          lib="${lib_dir}/librusty_v8.a"
          if [[ -f "$lib" ]]; then
            echo "librusty_v8.a survived the cache round trip"
            exit 0
          fi
          mkdir -p "$lib_dir"
          gzip -dc "$RUSTY_V8_ARCHIVE" > "$lib"
          echo "Unpacked $(du -h "$lib" | cut -f1) to $lib"

      - name: Build and hash bwrap
        if: matrix.is_linux
        shell: bash
        run: |
          set -euo pipefail
          cargo build --target "$TARGET" --release --bin bwrap
          bwrap_path="target/${TARGET}/release/bwrap"
          strip --strip-debug --strip-unneeded "$bwrap_path"
          digest="$(sha256sum "$bwrap_path" | awk '{print $1}')"
          echo "CODEX_BWRAP_SHA256=$digest" >> "$GITHUB_ENV"

      - name: Build Codex package binaries
        shell: bash
        env:
          CODEX_DOWNSTREAM_BUILD: "1"
          CODEX_DOWNSTREAM_RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: >-
          cargo build --target "$TARGET" --release
          --bin codex
          --bin codex-code-mode-host

      - name: Download official patched zsh manifest
        shell: bash
        run: |
          set -euo pipefail
          zsh_release_tag="$(
            sed -n \
              's/^[[:space:]]*CODEX_ZSH_RELEASE_TAG:[[:space:]]*//p' \
              "${GITHUB_WORKSPACE}/.github/workflows/rust-release.yml" \
              | head -n 1
          )"
          if [[ ! "$zsh_release_tag" =~ ^codex-zsh-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not resolve the upstream patched zsh release tag" >&2
            exit 1
          fi

          zsh_manifest="${RUNNER_TEMP}/codex-zsh"
          curl -fsSL \
            "https://github.com/${UPSTREAM_REPOSITORY}/releases/download/${zsh_release_tag}/codex-zsh" \
            -o "$zsh_manifest"
          grep -Fq 'https://github.com/openai/codex/releases/download/' "$zsh_manifest"
          echo "CODEX_ZSH_MANIFEST=$zsh_manifest" >> "$GITHUB_ENV"
          echo "Using OpenAI patched zsh release $zsh_release_tag"

      - name: Strip, verify, and package
        shell: bash
        env:
          IS_LINUX: ${{ matrix.is_linux }}
          PLATFORM: ${{ matrix.platform }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          codex_path="target/${TARGET}/release/codex"
          code_mode_host_path="target/${TARGET}/release/codex-code-mode-host"
          for binary_path in "$codex_path" "$code_mode_host_path"; do
            if [[ "$IS_LINUX" == "true" ]]; then
              strip --strip-debug --strip-unneeded "$binary_path"
            else
              strip -x "$binary_path"
            fi

            file_output="$(file "$binary_path")"
            echo "$file_output"
            case "$PLATFORM" in
              linux-amd64)
                grep -Eq 'ELF 64-bit.*x86-64' <<< "$file_output"
                ;;
              linux-arm64)
                grep -Eq 'ELF 64-bit.*ARM aarch64' <<< "$file_output"
                ;;
              macos-arm64)
                grep -Eq 'Mach-O 64-bit.*(arm64.*executable|executable.*arm64)' <<< "$file_output"
                ;;
              *)
                echo "Unexpected platform: $PLATFORM" >&2
                exit 1
                ;;
            esac
          done

          package_root="${RUNNER_TEMP}/package"
          package_args=(
            "${GITHUB_WORKSPACE}/scripts/build_codex_package.py"
            --target "$TARGET"
            --variant codex
            --entrypoint-bin "$codex_path"
            --code-mode-host-bin "$code_mode_host_path"
            --zsh-manifest "$CODEX_ZSH_MANIFEST"
            --package-dir "$package_root"
            --force
          )
          if [[ "$IS_LINUX" == "true" ]]; then
            package_args+=(
              --bwrap-bin "target/${TARGET}/release/bwrap"
            )
          fi
          python3 "${package_args[@]}"

          # Keep the top-level entrypoints so the updater embedded in r1 can
          # consume this archive before r2 migrates the install to the package
          # layout on the next update/repair run.
          ln -s "bin/codex" "$package_root/codex"
          ln -s "bin/codex-code-mode-host" "$package_root/codex-code-mode-host"

          test -f "$package_root/codex-package.json"
          test -x "$package_root/bin/codex"
          test -x "$package_root/bin/codex-code-mode-host"
          test -x "$package_root/codex-path/rg"
          test -x "$package_root/codex-resources/zsh/bin/zsh"

          asset="codex-${RELEASE_TAG}-${PLATFORM}.tar.gz"
          tar -C "$package_root" -czf "${RUNNER_TEMP}/${asset}" .
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$RUNNER_TEMP" && sha256sum "$asset" > "${asset}.sha256")
          else
            (cd "$RUNNER_TEMP" && shasum -a 256 "$asset" > "${asset}.sha256")
          fi

      - name: Upload release asset
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-${{ matrix.platform }}
          # Keep this a single-line glob: the runner translates host paths to
          # container paths by rewriting the whole INPUT_PATH value as one path,
          # so only the first line of a multi-line glob survives inside a
          # container job.
          path: ${{ runner.temp }}/codex-*.tar.gz*
          if-no-files-found: error
          retention-days: 7

      - name: Report sccache stats
        if: always()
        continue-on-error: true
        shell: bash
        run: sccache --show-stats

  build_macos_arm64:
    name: Build macos-arm64 on Linux arm64
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/ttys3/codex-macos-cross:macos-27.0@sha256:9f2b9777f46a6daa11edbe0d8db6899bfd9164c9c8d8457d30905aa84f67133f
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      SCCACHE_IDLE_TIMEOUT: "0"
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: aarch64-apple-darwin

      - name: Install sccache
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          # install-action takes the version through the tool input; a separate
          # `version` key is not a valid input and is silently ignored, which
          # left every build resolving whatever the manifest called latest.
          tool: sccache@0.17.0

      # The Actions cache endpoints are only injected into JavaScript actions,
      # so re-export them for the sccache server spawned by the run steps below.
      - name: Export Actions cache endpoints
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'on');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Enable sccache
        shell: bash
        run: |
          set -euo pipefail
          wrapper="$(command -v sccache)"
          echo "RUSTC_WRAPPER=$wrapper" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_RUSTC_WRAPPER=$wrapper" >> "$GITHUB_ENV"
          # Fall back to the local disk cache instead of failing the whole build
          # when the Actions cache endpoints are unavailable.
          if [[ -n "${ACTIONS_RESULTS_URL:-}" && -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
            echo "Actions cache unavailable; using the sccache local disk cache"
          fi

      - name: Verify macOS cross toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(oa64-clang -dumpmachine)" = "arm64-apple-darwin"
          test -d "$SDKROOT"
          command -v aarch64-apple-darwin-ar
          command -v aarch64-apple-darwin-strip

      # Keep `workspaces` a single relative path. This job runs in a container,
      # where the runner rewrites an input's entire value as one host path, so a
      # multi-line or absolute value would survive translation only in part —
      # the same trap that truncated the artifact upload glob.
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: codex-rs
          key: aarch64-apple-darwin
          cache-bin: false

      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: aarch64-apple-darwin

      # See the matching step in the Linux build job: rust-cache drops
      # gn_out/obj while keeping the fingerprint that claims the static library
      # is already unpacked, so put the library back rather than invalidating
      # the fingerprint and rebuilding v8 along with everything behind it.
      - name: Restore the rusty_v8 static library dropped by the cache
        shell: bash
        run: |
          set -euo pipefail
          lib_dir="target/${TARGET}/release/gn_out/obj"
          lib="${lib_dir}/librusty_v8.a"
          if [[ -f "$lib" ]]; then
            echo "librusty_v8.a survived the cache round trip"
            exit 0
          fi
          mkdir -p "$lib_dir"
          gzip -dc "$RUSTY_V8_ARCHIVE" > "$lib"
          echo "Unpacked $(du -h "$lib" | cut -f1) to $lib"

      - name: Build Codex package binaries
        shell: bash
        env:
          CODEX_DOWNSTREAM_BUILD: "1"
          CODEX_DOWNSTREAM_RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: >-
          cargo build --target "$TARGET" --release
          --bin codex
          --bin codex-code-mode-host

      - name: Download official patched zsh manifest
        shell: bash
        run: |
          set -euo pipefail
          zsh_release_tag="$(
            sed -n \
              's/^[[:space:]]*CODEX_ZSH_RELEASE_TAG:[[:space:]]*//p' \
              "${GITHUB_WORKSPACE}/.github/workflows/rust-release.yml" \
              | head -n 1
          )"
          if [[ ! "$zsh_release_tag" =~ ^codex-zsh-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not resolve the upstream patched zsh release tag" >&2
            exit 1
          fi

          zsh_manifest="${RUNNER_TEMP}/codex-zsh"
          curl -fsSL \
            "https://github.com/${UPSTREAM_REPOSITORY}/releases/download/${zsh_release_tag}/codex-zsh" \
            -o "$zsh_manifest"
          grep -Fq 'https://github.com/openai/codex/releases/download/' "$zsh_manifest"
          echo "CODEX_ZSH_MANIFEST=$zsh_manifest" >> "$GITHUB_ENV"
          echo "Using OpenAI patched zsh release $zsh_release_tag"

      - name: Strip, verify, and package
        shell: bash
        env:
          PLATFORM: macos-arm64
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          codex_path="target/${TARGET}/release/codex"
          code_mode_host_path="target/${TARGET}/release/codex-code-mode-host"
          for binary_path in "$codex_path" "$code_mode_host_path"; do
            aarch64-apple-darwin-strip -x "$binary_path"
            file_output="$(file "$binary_path")"
            echo "$file_output"
            grep -Eq 'Mach-O 64-bit.*(arm64.*executable|executable.*arm64)' <<< "$file_output"
          done

          package_root="${RUNNER_TEMP}/package"
          python3 "${GITHUB_WORKSPACE}/scripts/build_codex_package.py" \
            --target "$TARGET" \
            --variant codex \
            --entrypoint-bin "$codex_path" \
            --code-mode-host-bin "$code_mode_host_path" \
            --zsh-manifest "$CODEX_ZSH_MANIFEST" \
            --package-dir "$package_root" \
            --force

          # Keep the top-level entrypoints so the updater embedded in r1 can
          # consume this archive before r2 migrates the install to the package
          # layout on the next update/repair run.
          ln -s "bin/codex" "$package_root/codex"
          ln -s "bin/codex-code-mode-host" "$package_root/codex-code-mode-host"

          test -f "$package_root/codex-package.json"
          test -x "$package_root/bin/codex"
          test -x "$package_root/bin/codex-code-mode-host"
          test -x "$package_root/codex-path/rg"
          test -x "$package_root/codex-resources/zsh/bin/zsh"

          asset="codex-${RELEASE_TAG}-${PLATFORM}.tar.gz"
          tar -C "$package_root" -czf "${RUNNER_TEMP}/${asset}" .
          (cd "$RUNNER_TEMP" && sha256sum "$asset" > "${asset}.sha256")

      - name: Upload release asset
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-macos-arm64
          # This job runs inside a container, where the runner rewrites the
          # whole INPUT_PATH value as a single host path. A multi-line glob
          # would leave every line but the first pointing at a host directory
          # that does not exist in the container, silently dropping the
          # checksum and pushing the archive under an `__w/_temp/` prefix.
          path: ${{ runner.temp }}/codex-*.tar.gz*
          if-no-files-found: error
          retention-days: 7

      - name: Report sccache stats
        if: always()
        continue-on-error: true
        shell: bash
        run: sccache --show-stats

  publish:
    name: Publish downstream release
    needs:
      - prepare
      - verify
      - build
      - build_macos_arm64
    if: >-
      needs.prepare.outputs.skip != 'true' &&
      needs.verify.result == 'success' &&
      needs.build.result == 'success' &&
      needs.build_macos_arm64.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find dist -maxdepth 1 -type f -name '*.tar.gz' | sort)
          mapfile -t checksums < <(find dist -maxdepth 1 -type f -name '*.sha256' | sort)
          if [[ "${#archives[@]}" -ne 3 || "${#checksums[@]}" -ne 3 ]]; then
            echo "Expected exactly three archives and three checksums" >&2
            find dist -maxdepth 1 -type f -print
            exit 1
          fi
          for checksum in "${checksums[@]}"; do
            (cd dist && sha256sum -c "$(basename "$checksum")")
          done
          for archive in "${archives[@]}"; do
            archive_entries="${RUNNER_TEMP}/$(basename "$archive").entries"
            tar -tzf "$archive" | sed 's#^\./##' > "$archive_entries"
            for required_entry in \
              codex \
              codex-package.json \
              bin/codex \
              bin/codex-code-mode-host \
              codex-path/rg \
              codex-resources/zsh/bin/zsh; do
              grep -Fxq "$required_entry" "$archive_entries" \
                || { echo "$archive is missing $required_entry" >&2; exit 1; }
            done
            if [[ "$archive" == *-linux-*.tar.gz ]]; then
              grep -Fxq 'codex-resources/bwrap' "$archive_entries" \
                || { echo "$archive is missing codex-resources/bwrap" >&2; exit 1; }
            fi
          done

      - name: Fast-forward maintained branch
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          git fetch origin "$DOWNSTREAM_BRANCH"
          if ! git merge-base --is-ancestor FETCH_HEAD "$CANDIDATE_SHA"; then
            echo "$DOWNSTREAM_BRANCH moved while this workflow was running" >&2
            exit 1
          fi
          git push origin "$CANDIDATE_SHA:refs/heads/$DOWNSTREAM_BRANCH"

      - name: Create annotated release tag
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            existing_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$existing_sha" != "$CANDIDATE_SHA" ]]; then
              echo "$RELEASE_TAG already points to $existing_sha" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$CANDIDATE_SHA" \
              -m "Codex status-line downstream release for $UPSTREAM_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/release-notes.md"
          cat > "$notes" <<EOF
          Downstream Codex build based on OpenAI Codex \
          [${UPSTREAM_TAG}](https://github.com/${UPSTREAM_REPOSITORY}/releases/tag/${UPSTREAM_TAG}).

          This release carries the status-line extensions documented in \
          [DOWNSTREAM.md](https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/DOWNSTREAM.md).

          The bundled \`codex update\` checks OpenAI's official latest Release first and downloads
          verified update archives only from this fork's GitHub Release.

          Release assets are limited to:

          Every package includes \`codex-code-mode-host\`, OpenAI's pinned patched zsh, and the
          pinned ripgrep resource. Linux packages also include the required bundled bwrap.

          - Linux amd64 (musl)
          - Linux arm64 (musl)
          - macOS arm64 (unsigned Codex binaries, cross-compiled on Linux arm64)
          EOF

          prerelease_args=()
          upstream_version="${UPSTREAM_TAG#rust-v}"
          if [[ "$upstream_version" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Codex statusline ${UPSTREAM_TAG#rust-v} r${RELEASE_TAG##*-r}" \
            --notes-file "$notes" \
            "${prerelease_args[@]}"

      - name: Remove temporary candidate branch
        shell: bash
        env:
          CANDIDATE_BRANCH: ${{ needs.prepare.outputs.candidate_branch }}
        run: |
          git push origin --delete "$CANDIDATE_BRANCH" \
            || echo "Could not remove temporary branch $CANDIDATE_BRANCH"
